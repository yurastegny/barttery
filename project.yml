name: Barttery
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: 4Y3FA3437G
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "4"
    CODE_SIGN_STYLE: Automatic
    # The bundled USB/Wi-Fi helpers are currently Apple Silicon only.
    ARCHS: arm64
targets:
  Barttery:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes: [Resources]
      - path: Sources/Resources
        buildPhase: resources
        excludes: [lib]
      - path: Sources/Resources/lib
        buildPhase: resources
      - path: AppIcon.icns
        buildPhase: resources
    info:
      path: Widgets/Host-Info.plist
      properties:
        CFBundleDisplayName: Barttery
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSBluetoothAlwaysUsageDescription: Used to display Bluetooth device battery levels
        NSInputMonitoringUsageDescription: Used to query Logitech battery level and charging state via HID++. You can deny this — the app will still show battery level via Bluetooth.
        BartteryWidgetsEnabled: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.yura.barttery
        CODE_SIGN_ENTITLEMENTS: Widgets/BartteryHost.entitlements
        ENABLE_APP_SANDBOX: NO
        # This phase modifies copied helper binaries with codesign.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - sdk: IOBluetooth.framework
      - sdk: IOKit.framework
      - target: BartteryWidget
        embed: true
        codeSign: true
    postBuildScripts:
      - name: Sign bundled device helpers
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CODE_SIGNING_ALLOWED}" != "NO" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY}" ]; then
            for name in idevice_id ideviceinfo comptest bartbeat mobilebeat wifiwatch *.dylib; do
              for file in "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"/$name; do
                if [ -f "$file" ]; then
                  /usr/bin/codesign --force --options runtime --timestamp \
                    --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "$file" || exit 1
                fi
              done
            done
          fi

  BartteryWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Widgets/BartteryWidget.swift
      - path: Sources/WidgetSnapshot.swift
    info:
      path: Widgets/Widget-Info.plist
      properties:
        CFBundleDisplayName: Barttery Batteries
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.yura.barttery.widget
        CODE_SIGN_ENTITLEMENTS: Widgets/BartteryWidget.entitlements
        ENABLE_APP_SANDBOX: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
schemes:
  Barttery:
    build:
      targets:
        Barttery: all
